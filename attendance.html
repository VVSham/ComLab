<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5ede0;
      color: #333;
    }

    .page {
      display: flex;
      align-items: flex-start;
      gap: 30px;
      width: 100%;
      min-height: calc(100vh - 80px);
      padding: 40px 60px 40px 60px;
      box-sizing: border-box;
      position: relative;
    }

    .image-box {
      width: 240px;
      height: 240px;
      border: 2px dashed #d4c5b0;
      border-radius: 16px;
      background: #faf6f0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #8b7d6b;
      font-size: 16px;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
      align-self: flex-end;
      margin-top: auto;
    }

    .content {
      flex: 1;
      max-width: 900px;
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
      color: #2d7052;
    }

    .form-card {
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(45, 112, 82, 0.1);
      border-top: 4px solid #2d7052;
    }

    .form-intro {
      color: #8b7d6b;
      margin-top: 0;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
      color: #2d7052;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e8dcc8;
      border-radius: 8px;
      font: inherit;
      color: #333;
      background: #fff;
      text-transform: uppercase;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #2d7052;
      background: #faf6f0;
    }

    .submit-btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 8px;
      background: #2d7052;
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #1e5a3d;
    }

    .success-message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(45, 112, 82, 0.1);
      color: #2d7052;
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .top-bar, .page {
        padding-left: 20px;
        padding-right: 20px;
      }

      .page {
        flex-direction: column;
      }

      .image-box {
        display: none;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .stats-section {
      display: flex;
      gap: 20px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #2d7052;
      box-shadow: 0 4px 12px rgba(45, 112, 82, 0.1);
      flex: 1;
      min-width: 180px;
    }

    .stat-card .label {
      font-size: 12px;
      color: #8b7d6b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 28px;
      color: #2d7052;
      font-weight: 700;
    }

    .section-title {
      font-size: 18px;
      color: #2d7052;
      font-weight: 600;
      margin-top: 30px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "📊";
      font-size: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    thead {
      background: #2d7052;
      color: white;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
    }

    tbody tr:hover {
      background: #f5ede0;
    }

    tbody tr {
      border-bottom: 1px solid #e8dcc8;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-present {
      background: rgba(45, 112, 82, 0.1);
      color: #2d7052;
    }

    .status-absent {
      background: rgba(220, 100, 100, 0.1);
      color: #dc6464;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0;
      width: 100%;
      padding: 20px 60px 20px 60px;
      box-sizing: border-box;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(6px);
    }

    .breadcrumb {
      font-size: 14px;
      color: #666;
    }

    .breadcrumb a {
      color: #2d7052;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    
    .breadcrumb a:hover {
      color: #1e5a3d;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .back-btn {
      display: inline-block;
      padding: 10px 16px;
      background: #2d7052;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .back-btn:hover {
      background: #1e5a3d;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="breadcrumb">
      <a href="Opening.html">Home</a> &gt;
      <a href="Choose.html">Role Selection</a> &gt;
      <a href="Design.html">User Portal</a> &gt;
      <span>Attendance</span>
    </div>
    <a href="Design.html" class="back-btn">← Go Back</a>
  </div>

  <div class="page">
    <div class="image-box">
      📸 Photo
    </div>

    <div class="content">
      <h1>📋 Attendance Form</h1>
      <div class="form-card">
        <p class="form-intro">Please complete the form to record your attendance.</p>
        <form id="attendanceForm">
          <div class="form-group">
            <label for="studentName">Full name</label>
            <input id="studentName" name="studentName" type="text" required autocomplete="name" placeholder="Enter your full name">
          </div>
          <div class="form-group" id="studentGroup" style="display: none;">
            <label for="studentAttendeeName">Student's name</label>
            <input id="studentAttendeeName" name="studentAttendeeName" type="text" placeholder="Enter the student's full name">
          </div>
          <div class="form-row" id="parentDetailsRow" style="display: none;">
            <div class="form-group" id="studentGradeGroup">
              <label for="studentGrade">Student's grade</label>
              <select id="studentGrade" name="studentGrade">
                <option value="" selected disabled>Choose the student's grade</option>
                <option value="Grade 7">Grade 7</option>
                <option value="Grade 8">Grade 8</option>
                <option value="Grade 9">Grade 9</option>
                <option value="Grade 10">Grade 10</option>
                <option value="Grade 11">Grade 11</option>
                <option value="Grade 12">Grade 12</option>
              </select>
            </div>
            <div class="form-group" id="sectionGroup">
              <label for="section">Section</label>
              <input id="section" name="section" type="text" required placeholder="e.g. A">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="grade">Grade / Role</label>
              <select id="grade" name="grade" required>
                <option value="" selected disabled>Choose your grade or role</option>
                <option value="Grade 7">Grade 7</option>
                <option value="Grade 8">Grade 8</option>
                <option value="Grade 9">Grade 9</option>
                <option value="Grade 10">Grade 10</option>
                <option value="Grade 11">Grade 11</option>
                <option value="Grade 12">Grade 12</option>
                <option value="Teacher">Teacher</option>
                <option value="Parent/Guardian">Parent/Guardian</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="className" id="classNameLabel">Class/Subject</label>
            <input id="className" name="className" type="text" required placeholder="Enter your class or subject">
          </div>
          <button class="submit-btn" type="submit">Submit attendance</button>
          <div class="success-message" id="successMessage" role="status">Attendance recorded successfully.</div>
        </form>
      </div>
    </div>
  </div>
  <script>
    const attendanceForm = document.getElementById('attendanceForm');
    const successMessage = document.getElementById('successMessage');
    const attendanceStorageKey = 'attendanceRecords';
    const gradeInput = document.getElementById('grade');
    const sectionGroup = document.getElementById('sectionGroup');
    const sectionInput = document.getElementById('section');
    const studentGroup = document.getElementById('studentGroup');
    const studentAttendeeNameInput = document.getElementById('studentAttendeeName');
    const parentDetailsRow = document.getElementById('parentDetailsRow');
    const studentGradeGroup = document.getElementById('studentGradeGroup');
    const studentGradeInput = document.getElementById('studentGrade');
    const classNameLabel = document.getElementById('classNameLabel');
    const classNameInput = document.getElementById('className');
    const gradeRow = gradeInput.closest('.form-row');

    const subjectNames = {
      ap: 'AP',
      eng: 'English',
      fil: 'Filipino',
      ict: 'ICT',
      math: 'Math',
      mapeh: 'MAPEH',
      pe: 'PE',
      sci: 'Science',
      ss: 'Social Studies',
      tle: 'TLE'
    };

    function capitalizeWords(value) {
      return value.toLowerCase().replace(/[A-Za-z]+/g, (word) => word.charAt(0).toUpperCase() + word.slice(1));
    }

    function normalizeName(value) {
      const name = value.trim().replace(/\.+/g, '.').replace(/\s+/g, ' ');
      const nameParts = name.includes(',')
        ? [name.slice(name.indexOf(',') + 1).trim(), name.slice(0, name.indexOf(','))]
        : [name];
      return capitalizeWords(nameParts.join(' ')).replace(/\b([A-Za-z])\.?(?=\s|$)/g, '$1.').toUpperCase();
    }

    function normalizeSubject(value) {
      const normalized = value.trim().replace(/\s+/g, ' ').toLowerCase();
      return normalized.split(' ').map((word) => subjectNames[word] || capitalizeWords(word)).join(' ').toUpperCase();
    }

    function normalizeRecord(record) {
      return {
        ...record,
        name: normalizeName(record.name),
        reason: record.reason ? record.reason.trim().replace(/\s+/g, ' ').toUpperCase() : '',
        grade: capitalizeWords(record.grade.trim().replace(/\s+/g, ' ')).toUpperCase(),
        section: record.section.trim().replace(/\s+/g, ' ').toUpperCase(),
        className: normalizeSubject(record.className)
      };
    }

    attendanceForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const formData = new FormData(attendanceForm);
      const record = normalizeRecord({
        id: `ATT-${Date.now()}`,
        name: formData.get('studentName'),
        studentName: formData.get('studentAttendeeName') || '',
        studentGrade: formData.get('studentGrade') || '',
        reason: formData.get('grade') === 'Parent/Guardian' ? formData.get('className') : '',
        grade: formData.get('grade'),
        section: formData.get('section') || '',
        className: formData.get('className'),
        date: new Date().toISOString().slice(0, 10),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        status: 'Present'
      });
      const records = JSON.parse(localStorage.getItem(attendanceStorageKey) || '[]');
      records.push(record);
      localStorage.setItem(attendanceStorageKey, JSON.stringify(records));
      attendanceForm.reset();
      successMessage.style.display = 'block';
    });

    gradeInput.addEventListener('change', () => {
      const isTeacher = gradeInput.value === 'Teacher';
      const isParentGuardian = gradeInput.value === 'Parent/Guardian';
      sectionGroup.style.display = isTeacher ? 'none' : '';
      sectionInput.required = !isTeacher;
      sectionInput.disabled = isTeacher;
      if (isTeacher) sectionInput.value = '';
      studentGroup.style.display = isParentGuardian ? '' : 'none';
      studentAttendeeNameInput.required = isParentGuardian;
      studentAttendeeNameInput.disabled = !isParentGuardian;
      if (!isParentGuardian) studentAttendeeNameInput.value = '';
      parentDetailsRow.style.display = isParentGuardian ? '' : 'none';
      studentGradeInput.required = isParentGuardian;
      studentGradeInput.disabled = !isParentGuardian;
      if (!isParentGuardian) studentGradeInput.value = '';
      if (isParentGuardian) {
        parentDetailsRow.append(sectionGroup);
      } else {
        gradeRow.append(sectionGroup);
      }
      classNameLabel.textContent = isParentGuardian ? 'Reason for visiting' : 'Class/Subject';
      classNameInput.placeholder = isParentGuardian ? 'Enter the reason for visiting' : 'Enter your class or subject';
    });
    gradeInput.dispatchEvent(new Event('change'));
  </script>
</body>
</html>
