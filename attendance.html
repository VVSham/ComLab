<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f7fb;
      color: #222;
    }

    .page {
      display: flex;
      align-items: flex-start;
      gap: 30px;
      width: 100%;
      min-height: calc(100vh - 80px);
      padding: 40px 60px 40px 60px;
      box-sizing: border-box;
      position: relative;
    }

    .image-box {
      width: 240px;
      height: 240px;
      border: 2px dashed #8fa0b8;
      border-radius: 16px;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #5d6b84;
      font-size: 16px;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
      align-self: flex-end;
      margin-top: auto;
    }

    .content {
      flex: 1;
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0;
      width: 100%;
      padding: 20px 60px 20px 60px;
      box-sizing: border-box;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(6px);
    }

    .breadcrumb {
      font-size: 14px;
      color: #666;
    }

    .breadcrumb a {
      color: #4f6ef7;
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .back-btn {
      display: inline-block;
      padding: 10px 16px;
      background: #4f6ef7;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }

    .back-btn:hover {
      background: #3756c9;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="breadcrumb">
      <a href="Opening.html">Desktop</a> &gt;
      <a href="Choose.html">Choose</a> &gt;
      <a href="Design.html">Design</a> &gt;
      <span>Attendance</span>
    </div>
    <a href="Design.html" class="back-btn">← Go Back</a>
  </div>

  <div class="page">
    <div class="image-box">
      Square picture placeholder
    </div>

    <div class="content">
      <h1>Attendance Log</h1>
      <p>This area can be used for attendance details or related content.</p>
    </div>
  </div>
</body>
</html>
