<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rounded Boxes</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f4f4f4;
    }

    .breadcrumb {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
      padding: 8px 0;
    }

    .breadcrumb a {
      color: #4f6ef7;
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .heading {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 40px;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 80px;
    }

    .box {
      width: 280px;
      height: 220px;
      padding: 24px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 20px;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .box h3 {
      font-size: 28px;
      margin: 0 0 0px;
    }

    .idle-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .idle-popup {
      background: white;
      padding: 24px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: min(90vw, 320px);
    }

    .idle-popup p {
      margin: 0 0 8px;
      font-size: 18px;
      color: #222;
    }

    .idle-popup .countdown {
      margin: 0 0 16px;
      font-size: 14px;
      color: #666;
    }

    .idle-actions {
      display: flex;
      justify-content: flex-end;
    }

    .idle-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #4f6ef7;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      display: inline-block;
      padding: 8px 14px;
      background: #4f6ef7;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="breadcrumb">
      <a href="Opening.html">Desktop</a> &gt;
      <a href="Choose.html">Choose</a> &gt;
      <span>Design</span>
    </div>
    <a href="Choose.html" class="back-btn">← Go Back</a>
  </div>

  <h1 class="heading">I'm here for...</h1>
  <div class="container">
    <a href="attendance.html" class="box">
      <h3>Attendance Log</h3>
      <p></p>
    </a>
    <a href="borrow.html" class="box">
      <h3>Borrow</h3>
      <p></p>
    </a>
  </div>

  <div class="idle-overlay" id="idleOverlay">
    <div class="idle-popup">
      <p>Are you still there?</p>
      <p class="countdown" id="idleCountdown">Going back to Loading Screen in 30</p>
      <div class="idle-actions">
        <button class="idle-btn" id="idleYesBtn">Yes</button>
      </div>
    </div>
  </div>

  <script>
    const idleOverlay = document.getElementById('idleOverlay');
    const idleYesBtn = document.getElementById('idleYesBtn');
    const idleCountdown = document.getElementById('idleCountdown');
    const idleMs = 30000;
    const redirectSeconds = 30;
    let idleTimer;
    let redirectTimer;
    let countdownTimer;
    let secondsLeft = redirectSeconds;

    function resetIdleTimers() {
      clearTimeout(idleTimer);
      clearTimeout(redirectTimer);
      clearInterval(countdownTimer);
      idleOverlay.style.display = 'none';
      secondsLeft = redirectSeconds;
      idleCountdown.textContent = `Going back to Loading Screen in ${secondsLeft}`;
      idleTimer = setTimeout(() => {
        idleOverlay.style.display = 'flex';
        startCountdown();
      }, idleMs);
      redirectTimer = setTimeout(() => {
        window.location.href = 'Opening.html';
      }, idleMs + redirectSeconds * 1000);
    }

    function startCountdown() {
      countdownTimer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          clearInterval(countdownTimer);
          secondsLeft = 0;
        }
        idleCountdown.textContent = `Going back to Loading Screen in ${secondsLeft}`;
      }, 1000);
    }

    function dismissPopup() {
      idleOverlay.style.display = 'none';
      clearInterval(countdownTimer);
      resetIdleTimers();
    }

    ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach((eventName) => {
      document.addEventListener(eventName, resetIdleTimers, { passive: true });
    });

    idleYesBtn.addEventListener('click', dismissPopup);
    resetIdleTimers();
  </script>
</body>
</html>
