<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Role</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f5ede0;
    }

    .heading {
      text-align: center;
      margin-top: 60px;
      margin-bottom: 40px;
      font-size: 28px;
      font-weight: bold;
      color: #2d7052;
    }

    .container {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 80px;
    }

    .box {
      width: 280px;
      height: 220px;
      padding: 24px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(45, 112, 82, 0.15);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 20px;
      color: #2d7052;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    
    .box:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(45, 112, 82, 0.25);
      border-color: #2d7052;
    }

    .box h3 {
      font-size: 28px;
      margin: 0 0 0px;
      color: #2d7052;
      font-weight: 600;
    }

    .box p {
      font-size: 14px;
      color: #8b7d6b;
      margin-top: 8px;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .footer {
      text-align: center;
      margin-top: 60px;
      padding-top: 20px;
      border-top: 2px solid #e8dcc8;
      color: #8b7d6b;
      font-size: 14px;
    }

    .footer p {
      margin: 4px 0;
    }

    .idle-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .idle-popup {
      background: white;
      padding: 24px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: min(90vw, 320px);
    }

    .idle-popup p {
      margin: 0 0 8px;
      font-size: 18px;
      color: #222;
    }

    .idle-popup .countdown {
      margin: 0 0 16px;
      font-size: 14px;
      color: #666;
    }

    .idle-actions {
      display: flex;
      justify-content: flex-end;
    }

    .idle-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #2d7052;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease;
    }
    
    .idle-btn:hover {
      background: #1e5a3d;
    }
  </style>
  </style>
</head>
<body>
  <h1 class="heading">👤 Choose Your Role</h1>
  <div class="container">
    <a href="adlogin.html" class="box">
      <div class="icon">🔑</div>
      <h3>Admin</h3>
      <p>Manage system & records</p>
    </a>
    <a href="Design.html" class="box">
      <div class="icon">👥</div>
      <h3>Visitor</h3>
      <p>View attendance & borrow</p>
    </a>
  </div>
  
  <div class="footer">
    <p>🔒 Secure System</p>
    <p>© 2026 Management System</p>
  </div>

  <div class="idle-overlay" id="idleOverlay">
    <div class="idle-popup">
      <p>Are you still there?</p>
      <p class="countdown" id="idleCountdown">Going back to Loading Screen in 30</p>
      <div class="idle-actions">
        <button class="idle-btn" id="idleYesBtn">Yes</button>
      </div>
    </div>
  </div>

  <script>
    const idleOverlay = document.getElementById('idleOverlay');
    const idleYesBtn = document.getElementById('idleYesBtn');
    const idleCountdown = document.getElementById('idleCountdown');
    const idleMs = 30000;
    const redirectSeconds = 30;
    let idleTimer;
    let redirectTimer;
    let countdownTimer;
    let secondsLeft = redirectSeconds;

    function resetIdleTimers() {
      clearTimeout(idleTimer);
      clearTimeout(redirectTimer);
      clearInterval(countdownTimer);
      idleOverlay.style.display = 'none';
      secondsLeft = redirectSeconds;
      idleCountdown.textContent = `Going back to Loading Screen in ${secondsLeft}`;
      idleTimer = setTimeout(() => {
        idleOverlay.style.display = 'flex';
        startCountdown();
      }, idleMs);
      redirectTimer = setTimeout(() => {
        window.location.href = 'Opening.html';
      }, idleMs + redirectSeconds * 1000);
    }

    function startCountdown() {
      countdownTimer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          clearInterval(countdownTimer);
          secondsLeft = 0;
        }
        idleCountdown.textContent = `Going back to Loading Screen in ${secondsLeft}`;
      }, 1000);
    }

    function dismissPopup() {
      idleOverlay.style.display = 'none';
      clearInterval(countdownTimer);
      resetIdleTimers();
    }

    ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach((eventName) => {
      document.addEventListener(eventName, resetIdleTimers, { passive: true });
    });

    idleYesBtn.addEventListener('click', dismissPopup);
    resetIdleTimers();
  </script>
</body>
</html>
