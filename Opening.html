<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Scene</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
      color: white;
      overflow: hidden;
    }

    .opening-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      cursor: pointer;
    }

    .video-placeholder {
      width: 100%;
      height: 100%;
      border: 2px solid rgba(255,255,255,0.15);
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      display: flex;
      justify-content: center;
      align-items: center;
      color: rgba(255,255,255,0.8);
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .overlay-text {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      animation: blink 1.2s infinite;
      text-shadow: 0 0 12px rgba(255,255,255,0.7);
    }

    .idle-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .idle-popup {
      background: white;
      color: #222;
      padding: 24px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: min(90vw, 320px);
    }

    .idle-popup p {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .idle-popup .countdown {
      margin: 0 0 16px;
      font-size: 14px;
      color: #666;
    }

    .idle-actions {
      display: flex;
      justify-content: flex-end;
    }

    .idle-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #4f6ef7;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
  </style>
</head>
<body>
  <div class="opening-screen" onclick="window.location.href='Choose.html'">
    <div class="video-placeholder">
      Video area placeholder
    </div>
    <div class="overlay-text">Click Anywhere to Start</div>
  </div>

  <div class="idle-overlay" id="idleOverlay">
    <div class="idle-popup">
      <p>Are you still there?</p>
      <p class="countdown" id="idleCountdown">Going back to Loading Screen in 30</p>
      <div class="idle-actions">
        <button class="idle-btn" id="idleYesBtn">Yes</button>
      </div>
    </div>
  </div>

  <script>
    const idleOverlay = document.getElementById('idleOverlay');
    const idleYesBtn = document.getElementById('idleYesBtn');
    const idleCountdown = document.getElementById('idleCountdown');
    const idleMs = 30000;
    const redirectSeconds = 30;
    let idleTimer;
    let redirectTimer;
    let countdownTimer;
    let secondsLeft = redirectSeconds;

    function resetIdleTimers() {
      clearTimeout(idleTimer);
      clearTimeout(redirectTimer);
      clearInterval(countdownTimer);
      idleOverlay.style.display = 'none';
      secondsLeft = redirectSeconds;
      idleCountdown.textContent = `Going back to Loading Screen in ${secondsLeft}`;
      idleTimer = setTimeout(() => {
        idleOverlay.style.display = 'flex';
        startCountdown();
      }, idleMs);
      redirectTimer = setTimeout(() => {
        window.location.href = 'Opening.html';
      }, idleMs + redirectSeconds * 1000);
    }

    function startCountdown() {
      countdownTimer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          clearInterval(countdownTimer);
          secondsLeft = 0;
        }
        idleCountdown.textContent = `Going back to Loading Screen in ${secondsLeft}`;
      }, 1000);
    }

    function dismissPopup() {
      idleOverlay.style.display = 'none';
      clearInterval(countdownTimer);
      resetIdleTimers();
    }

    ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach((eventName) => {
      document.addEventListener(eventName, resetIdleTimers, { passive: true });
    });

    idleYesBtn.addEventListener('click', dismissPopup);
    resetIdleTimers();
  </script>
</body>
</html>
