<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Scene</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #2d7052;
      color: white;
      overflow: hidden;
    }

    .opening-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2d7052, #1e5a3d);
      cursor: pointer;
    }

    .video-placeholder {
      width: 100%;
      height: 100%;
      border: 2px solid rgba(245, 237, 224, 0.25);
      background: linear-gradient(135deg, rgba(245, 237, 224, 0.1), rgba(245, 237, 224, 0.03));
      display: flex;
      justify-content: center;
      align-items: center;
      color: rgba(245, 237, 224, 0.9);
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .overlay-text {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      animation: blink 1.2s infinite;
      text-shadow: 0 0 12px rgba(245, 237, 224, 0.8);
      color: #f5ede0;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
  </style>
</head>
<body>
  <div class="opening-screen" onclick="window.location.href='Choose.html'">
    <div class="video-placeholder">
      Video area placeholder
    </div>
    <div class="overlay-text">Click Anywhere to Start</div>
  </div>

  <script>
  </script>
</body>
</html>
